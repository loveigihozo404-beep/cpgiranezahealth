<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#082b3a" />
    <meta name="description" content="CarePath Training Institute empowers healthcare professionals through practical training and compassionate home-care support." />
    <title>CarePath Training Institute</title>
    <link rel="icon" type="image/png" href="/cp-giraneza-health-logo.png" />
    <script>
      // Apply the saved theme before first paint so there is no flash of the
      // wrong theme. The value is kept in sync by src/lib/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem('cpg-theme');
          if (t !== 'light' && t !== 'dark') { t = 'light'; }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
